[package]
name = "stellar-invoice-protocol"
version = "0.1.0"
edition = "2021"
description = "Stellar Invoice Protocol — Soroban smart contract for invoice lifecycle management"
license = "MIT"
repository = "https://github.com/drips-network/sip-contract"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
