[package]
name = "stellar-invoice-protocol"
version = "0.1.0"
edition = "2021"
description = "Stellar Invoice Protocol - Soroban smart contract"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "27.0.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
ed25519-dalek = "=2.2.0"
soroban-sdk = { version = "27.0.0", features = ["testutils"] }
